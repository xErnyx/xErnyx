<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Museo de San Francisco — web development project">
  <title>Museo de San Francisco — web development project</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-25%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
  </defs>
  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="22" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="299" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".14"/>

  <rect x="56" y="75" width="150" height="150" rx="38" fill="url(#t)" filter="url(#sh)"/>
  <path d="M56 113a38 38 0 0 1 38-38h74a38 38 0 0 1 38 38v37H56z" fill="url(#s)"/>
  <g transform="translate(76 95) scale(4.2)" fill="#fff">
    <path d="M12 3 2.5 8.5h19z"/>
    <path d="M5 10h2.5v7H5zM10.75 10h2.5v7h-2.5zM16.5 10h2.5v7H16.5z"/>
    <path d="M3 18.5h18V21H3z"/>
  </g>

  <text x="262" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#a78bfa">FEATURED PROJECT</text>
  <text x="260" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#fff">Museo de San Francisco</text>
  <text x="262" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#cbd5e1">Website for the museum: responsive design, clear navigation</text>
  <text x="262" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#cbd5e1">and a clean experience for visitors.</text>
  <rect x="262" y="226" width="84" height="34" rx="17" fill="#E34F26"/>
  <text x="304" y="248" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">HTML5</text>
  <rect x="358" y="226" width="76" height="34" rx="17" fill="#1572B6"/>
  <text x="396" y="248" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">CSS3</text>
  <rect x="446" y="226" width="112" height="34" rx="17" fill="#F7DF1E"/>
  <text x="502" y="248" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1b1b1b">JavaScript</text>

  <rect x="800" y="40" width="148" height="34" rx="17" fill="#22c55e" fill-opacity=".14" stroke="#22c55e" stroke-opacity=".6"/>
  <circle cx="822" cy="57" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="836" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#86efac">In progress</text>
  <text x="944" y="268" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8">Lead web developer</text>
</svg>
